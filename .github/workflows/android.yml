name: NeiroFM Android CI and Release

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Download bundled Russian voice models
        run: |
          mkdir -p app/src/main/assets/voices
          set -euo pipefail
          for voice in denis dmitri irina; do
            archive="vits-piper-ru_RU-${voice}-medium"
            url="https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/${archive}.tar.bz2"
            curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 "$url" -o "app/src/main/assets/voices/${archive}.tar.bz2"
            test -s "app/src/main/assets/voices/${archive}.tar.bz2"
          done
          du -h app/src/main/assets/voices/*
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build installable APK with embedded voices
        run: gradle --no-daemon clean assembleDebug
      - name: Verify APK exists and report size
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload CI APK
        uses: actions/upload-artifact@v4
        with:
          name: NeiroFM-debug-with-voices
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: NeiroFM ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
